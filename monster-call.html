<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>괴물 전화</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{
  --bg:#f4ecff; --card:#ffffff; --ink:#2b1458; --muted:#7d6aa8; --line:#d8c8f5;
  --pink:#ff3d8b; --pink-edge:#b2155a; --yellow:#ffc928;
  --mc:#8e5cff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1d0f3f; --card:#2c1b5e; --ink:#fff1c9; --muted:#b4a3e0; --line:#4a3290; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.screen{display:none; min-height:100%; padding:22px 18px 28px; flex-direction:column; align-items:center; gap:16px}
.screen.active{display:flex}
h1{font-size:2.4rem;margin:6px 0 0}
.lead{margin:0;text-align:center;color:var(--muted);max-width:30em}
.field{align-self:flex-start;margin:8px 0 0;font-size:1.15rem}
input{
  width:100%;font:inherit;font-size:1.3rem;padding:12px 14px;border-radius:14px;
  border:2px solid var(--line);background:var(--card);color:var(--ink);
}
input:focus-visible,button:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.pick{
  font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);
  border-radius:18px;padding:8px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
}
.pick svg{width:100%;max-width:96px;height:auto}
.pick[aria-pressed="true"]{border-color:var(--pink);box-shadow:0 5px 0 var(--pink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.chip{
  font:inherit;font-size:1.1rem;padding:9px 16px;border-radius:999px;cursor:pointer;
  background:var(--card);color:var(--ink);border:2px solid var(--line);
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.start{
  font:inherit;font-size:1.8rem;width:100%;padding:.5em 1em;margin-top:10px;border:0;border-radius:999px;
  background:var(--pink);color:#fff;box-shadow:0 7px 0 var(--pink-edge);cursor:pointer;touch-action:manipulation;
}
.start:active{transform:translateY(5px);box-shadow:0 2px 0 var(--pink-edge)}
.tip{max-width:22em;text-align:center;opacity:.9;margin:0;line-height:1.4}
.test{font:inherit;font-size:1.15rem;padding:.45em 1.4em;border-radius:999px;cursor:pointer;background:transparent;color:var(--ink);border:2px solid var(--line);margin-top:6px}
.note{margin:0;color:var(--muted);font-size:.95rem;text-align:center}

/* 통화 화면 */
.call-bg{
  color:#fff; text-align:center; justify-content:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 65%,#000),#12082e);
}
.who{font-size:2rem;margin:0}
.state{margin:0;font-size:1.2rem;opacity:.85}
.big{font-size:2rem;margin:0}
.avatar{width:min(66vw,300px);aspect-ratio:1}
.avatar.small{width:min(40vw,160px)}
.avatar svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 0 rgba(0,0,0,.2))}
.avatar.ringing{animation:shake .7s ease-in-out infinite}
.avatar.sad{animation:none;transform:translateY(8px) scale(.96)}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg) translateY(-6px)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg) translateY(-4px)}80%{transform:rotate(5deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.mouth{transform-box:fill-box;transform-origin:50% 0}
.avatar.talking .mouth{animation:talk .28s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.1)}}
.avatar.talking{animation:bounce .5s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.btns{display:flex;gap:56px;margin-top:10px}
.round{
  width:78px;height:78px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 6px 0 rgba(0,0,0,.28);touch-action:manipulation;
}
.round svg{width:38px;height:38px;fill:#fff}
.round.green{background:#2fbf71;animation:pulse 1s ease-in-out infinite}
.round.red{background:#ee4b55}
.round.hang svg{transform:rotate(135deg)}
@keyframes pulse{50%{transform:scale(1.12)}}
.subtitle{font-size:clamp(1.4rem,5vw,1.9rem);margin:0;min-height:3.4em;max-width:22em;line-height:1.35}
.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;min-height:3.4em}
.choice{
  font:inherit;font-size:1.3rem;padding:.6em 1.2em;border-radius:999px;border:0;cursor:pointer;
  background:var(--yellow);color:#2b1458;box-shadow:0 5px 0 #b88900;
}
.ghost{
  font:inherit;font-size:1.2rem;padding:.5em 1.4em;border-radius:999px;cursor:pointer;
  background:transparent;color:#fff;border:2px solid rgba(255,255,255,.6);
}
@media (prefers-reduced-motion:reduce){
  .avatar.ringing,.avatar.talking,.round.green,.eye{animation:none}
  .avatar.talking .mouth{animation:none}
}
</style>
</head>
<body>

<section class="screen active" id="setup">
  <h1>괴물 전화</h1>
  <p class="lead">말을 안 들을 때 괴물이 전화해서 따끔하게, 하지만 재미있게 말해 줘요. 고른 뒤 휴대폰을 아이에게 건네 주세요.</p>

  <label class="field" for="name">아이 이름</label>
  <input id="name" type="text" maxlength="10" placeholder="예) 하준" autocomplete="off">

  <p class="field">전화 걸 괴물</p>
  <div class="picker" id="picker"></div>

  <p class="field">어떤 일로 전화할까요?</p>
  <div class="chips" id="sits"></div>

  <p class="field">전화가 오는 시간</p>
  <div class="chips" id="chips">
    <button class="chip" data-s="0" aria-pressed="true">바로</button>
    <button class="chip" data-s="10" aria-pressed="false">10초 뒤</button>
    <button class="chip" data-s="30" aria-pressed="false">30초 뒤</button>
    <button class="chip" data-s="60" aria-pressed="false">1분 뒤</button>
  </div>

  <button class="test" id="test">소리 확인</button>
  <button class="start" id="start">전화 오게 하기</button>
  <p class="note">소리를 켜 두세요. 소리 확인을 눌러 괴물 목소리가 나오는지 확인하세요. 한국어 음성이 없는 기기에서는 괴물 말소리(뿅뿅)가 대신 나와요. 기다리는 동안 화면은 켜 둔 채로 두세요.</p>
</section>

<section class="screen call-bg" id="waiting">
  <p class="big" id="waitText">곧 전화가 와요</p>
  <button class="ghost" id="cancel">취소</button>
</section>

<section class="screen call-bg" id="ring">
  <p class="who" id="ringName"></p>
  <p class="state" id="ringState">전화가 왔어요!</p>
  <div class="avatar ringing" id="ringAvatar"></div>
  <div class="btns">
    <button class="round red" id="decline" aria-label="거절"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg></button>
    <button class="round green" id="answer" aria-label="받기"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg></button>
  </div>
</section>

<section class="screen call-bg" id="call">
  <p class="who" id="callName"></p>
  <p class="state" id="time">00:00</p>
  <div class="avatar" id="callAvatar"></div>
  <p class="subtitle" id="subtitle" aria-live="polite"></p>
  <div class="choices" id="choices"></div>
  <button class="round red hang" id="hangup" aria-label="끊기"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg></button>
</section>

<section class="screen call-bg" id="end">
  <div class="avatar small" id="endAvatar"></div>
  <p class="big" id="endMsg"></p>
  <p class="state" id="endTime"></p>
  <p class="tip">통화가 끝나면 왜 그래야 하는지 아이에게 설명해 주고, 약속을 지키면 꼭 칭찬해 주세요.</p>
  <button class="start" id="again">처음으로</button>
</section>

<script>
/* ===== 괴물 설정: 여기 대사를 마음대로 고치세요 =====
   {name} 은 아이 이름으로 바뀌어요.
   ask: [[아이가 누를 버튼 글, 괴물의 대답], ...]                       */
const MONSTERS = [
  { id:'mungchi', name:'뭉치', color:'#8e5cff', dark:'#6a3be0', pitch:.55,
    intro:'어험! 나는 뭉치 괴물이다! {name}, 내 말을 잘 들어라!', outro:'뭉치는 이만 끊는다. 안녕!' },
  { id:'pikjuk', name:'삐죽이', color:'#33c27a', dark:'#1f9a5c', pitch:.4,
    intro:'이놈! 아니, {name}! 나는 삐죽이 괴물이다!', outro:'삐죽이는 이만 간다. 잘 있어라!' },
  { id:'mallang', name:'말랑이', color:'#ff9a3d', dark:'#e07a1a', pitch:1.35,
    intro:'말랑말랑 괴물이지만 오늘은 화가 났다! 나는 말랑이다, {name}!', outro:'말랑이는 이만 끊는다. 안녕!' }
];

/* 상황별 대사: ['말'] 또는 ['말', [[아이 버튼, 괴물 대답], [아이 버튼, 괴물 대답]]]
   {name} = 아이 이름, {m} = 괴물 이름 */
const SITS = [
  { id:'meal', label:'밥 먹기', lines:[
    ['{name}, 괴물이 다 보고 있었다. 밥을 잘 안 먹는다는 소문을 들었다!'],
    ['밥을 안 먹으면 키도 안 크고 힘도 안 세진다. 괴물은 밥을 잘 먹어서 이렇게 튼튼하단다!'],
    ['{name}, 오늘부터 밥을 잘 먹을 수 있겠니?', [['네, 잘 먹을게요!','좋다! 그 말을 들으니 괴물이 기쁘구나!'],['잘 모르겠어요','그럼 한 숟가락만 먼저 먹어 보자. 한 숟가락이면 된다!']]],
    ['편식은 안 된다. 당근도 먹고, 시금치도 먹는 거다!'],
    ['밥 먹을 때는 의자에 앉아서 꼭꼭 씹는 거다. 알겠니?', [['네!','목소리가 아주 좋구나! 약속이다!'],['싫어요','어허! 괴물이 속상하구나. 한 번만 더 생각해 보자.']]],
    ['엄마 아빠가 맛있게 만들어 주신 거니까, 고맙다고 말하는 거다.'],
    ['다 먹으면 괴물이 박수를 열 번 쳐 주마!'],
    ['{name}, 지금 가서 엄마 아빠한테 밥 잘 먹겠다고 말해 보렴.'],
    ['{name}은 착한 아이라고 괴물은 믿는다.'] ]},
  { id:'sleep', label:'잠자기', lines:[
    ['{name}, 지금 몇 시인 줄 아니? 괴물 나라는 벌써 모두 잠이 들었다!'],
    ['밤에 잠을 자야 키도 크고 머리도 똑똑해진단다.'],
    ['{name}, 지금 바로 이불 속으로 들어갈 수 있겠니?', [['네, 잘게요!','좋다! 역시 {name}이다!'],['더 놀고 싶어요','어허! 놀이는 내일 또 하는 거다. 괴물이 지켜보고 있다!']]],
    ['먼저 장난감은 제자리에, 불은 끄고, 이불은 턱까지 덮는 거다.'],
    ['눈을 감고 양 한 마리, 양 두 마리, 하나씩 세어 보렴.'],
    ['무서운 생각이 나면 엄마 아빠를 부르면 된다. 괴물도 그렇게 한다.', [['알겠어요','그래, 아주 용감하구나!'],['무서워요','괜찮다. 괴물이 꿈속에서 지켜 주마.']]],
    ['잘 자는 아이한테는 괴물이 좋은 꿈을 선물로 보내 준다.'],
    ['{name}, 엄마 아빠한테 잘 자겠다고 인사하고 오렴.'],
    ['{name}은 말을 잘 듣는 아이라고 괴물은 믿는다.'] ]},
  { id:'teeth', label:'양치하기', lines:[
    ['{name}, 괴물이 충치 괴물에게서 소식을 들었다. 이를 안 닦는다고!'],
    ['충치 괴물은 안 닦은 이를 좋아해서 이에 구멍을 뚫는단다. 아야, 아야!'],
    ['{name}, 오늘 이를 잘 닦을 수 있겠니?', [['네, 닦을게요!','그래, 장하다! 충치 괴물이 도망가겠구나!'],['싫어요','어허! 그럼 괴물이 노래를 불러 주마. 치카치카 쓱싹쓱싹!']]],
    ['위아래로, 앞뒤로, 구석구석 3분 동안 닦는 거다.'],
    ['혀도 살살 닦아 주고, 물로 입을 헹구면 끝이다.'],
    ['{name}, 이를 닦을 때 거품이 뽀글뽀글 나오면 재미있지 않니?', [['재미있어요','그렇지! 괴물도 그게 제일 좋더구나!'],['별로예요','그럼 노래를 부르며 닦아 보렴. 시간이 금방 간다!']]],
    ['다 닦으면 거울을 보고 이이 하고 웃어 보렴. 반짝반짝하면 괴물도 기쁘다.'],
    ['{name}, 지금 가서 양치하고 엄마 아빠한테 보여 드리렴.'],
    ['{name}은 깨끗한 이를 가진 멋진 아이라고 괴물은 믿는다.'] ]},
  { id:'toys', label:'장난감 정리', lines:[
    ['{name}, 괴물이 장난감들한테서 전화를 받았다. 바닥에서 울고 있다고 한다!'],
    ['장난감은 제자리에 가야 편하게 잘 수 있단다. 바닥은 차갑고 아프다고 한다.'],
    ['{name}, 지금 같이 정리해 줄 수 있겠니?', [['네, 할게요!','좋다! 장난감들이 박수를 치고 있구나!'],['조금만 있다가요','그래도 약속은 지켜야 한다. 열을 세고 시작하는 거다!']]],
    ['블록은 블록 통에, 인형은 침대 위에, 자동차는 차고에 쏙쏙 넣는 거다.'],
    ['엄마 아빠가 밟으면 아야 하고 다칠 수도 있으니 꼭 치워야 한다.'],
    ['{name}, 끝까지 혼자 정리할 수 있겠니?', [['네!','역시 멋지구나!'],['도와주세요','그럼 엄마 아빠한테 같이 하자고 말해 보렴.']]],
    ['다 치우면 방이 넓어져서 또 신나게 놀 수 있다.'],
    ['정리를 마치면 괴물한테 말하지 말고 엄마 아빠한테 자랑하는 거다.'],
    ['{name}은 정리를 잘하는 아이라고 괴물은 믿는다.'] ]},
  { id:'bath', label:'목욕하기', lines:[
    ['{name}, 괴물이 코를 킁킁했더니 목욕을 안 한 냄새가 난다!'],
    ['목욕을 하지 않으면 몸에 세균이 놀러 와서 가렵고 아플 수 있단다.'],
    ['{name}, 지금 목욕하러 갈 수 있겠니?', [['네, 갈게요!','좋다! 향기 나는 아이가 되겠구나!'],['싫어요','어허! 물놀이 장난감을 가져가면 재미있을 거다.']]],
    ['머리도 감고 몸도 구석구석 씻는 거다. 귀 뒤도, 발가락 사이도!'],
    ['비누 거품으로 수염을 만들어 보렴. 괴물도 해 봤는데 정말 재미있다.'],
    ['눈에 물이 들어가도 울지 않고 용감하게 하는 거다.', [['할 수 있어요','그래, 아주 용감하구나!'],['무서워요','괜찮다. 엄마 아빠가 옆에서 도와주실 거다.']]],
    ['다 씻으면 수건으로 쓱쓱 닦고 로션도 바르는 거다.'],
    ['{name}, 지금 엄마 아빠한테 목욕하겠다고 말해 보렴.'],
    ['{name}은 깨끗하고 멋진 아이라고 괴물은 믿는다.'] ]},
  { id:'phone', label:'폰·TV 그만', lines:[
    ['{name}, 괴물이 화면 속에서 다 보았다. 너무 오래 보고 있더구나!'],
    ['화면을 너무 오래 보면 눈이 아프고 머리도 아프단다.'],
    ['{name}, 이제 그만 보고 꺼 줄 수 있겠니?', [['네, 끌게요!','좋다! 약속을 지키는 아이는 멋지다!'],['조금만 더요','어허! 괴물이 열을 셀 테니 그동안 끄는 거다. 하나, 둘, 셋!']]],
    ['눈을 감고 열 번 깜빡깜빡 하고 멀리 창밖을 바라보렴.'],
    ['화면을 끄면 괴물이 할 수 있는 재미있는 놀이를 알려 주마. 숨바꼭질은 어떠니?'],
    ['{name}, 약속한 시간이 되면 스스로 끌 수 있겠니?', [['네!','그래, 믿겠다!'],['잘 모르겠어요','그럼 엄마 아빠한테 시간을 같이 정하자고 말해 보렴.']]],
    ['오늘 일이 끝나면 책도 읽고 그림도 그려 보렴.'],
    ['{name}, 지금 엄마 아빠한테 다 보았다고 말하고 오렴.'],
    ['{name}은 약속을 지키는 아이라고 괴물은 믿는다.'] ]}
];
let sit = SITS[0];

function buildLines(){
  return [{ say: sel.intro }]
    .concat(sit.lines.map(l => ({ say: l[0], ask: l[1] })))
    .concat([{ say: sel.outro }]);
}

/* ===== 괴물 그림 ===== */
function monsterSVG(m){
  const C = m.color, D = m.dark;
  const eye = (x,y,r) => `<g class="eye"><circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/><circle cx="${x+3}" cy="${y+2}" r="${r*.48}" fill="#2b1458"/><circle cx="${x+5}" cy="${y-1}" r="${r*.16}" fill="#fff"/></g>`;
  const cheeks = (y) => `<circle cx="64" cy="${y}" r="9" fill="#ff7aa8" opacity=".55"/><circle cx="136" cy="${y}" r="9" fill="#ff7aa8" opacity=".55"/>`;
  let body = '';
  if (m.id === 'mungchi') {
    body = `<ellipse cx="72" cy="178" rx="18" ry="9" fill="${D}"/><ellipse cx="128" cy="178" rx="18" ry="9" fill="${D}"/>
      <ellipse cx="100" cy="112" rx="72" ry="66" fill="${C}"/>
      <path d="M58 60 L46 26 L80 46Z" fill="${D}"/><path d="M142 60 L154 26 L120 46Z" fill="${D}"/>
      ${eye(100,96,26)}
      <g class="mouth"><path d="M70 136 Q100 170 130 136Z" fill="#4a1a2e"/><rect x="84" y="136" width="9" height="11" rx="2" fill="#fff"/><rect x="107" y="136" width="9" height="11" rx="2" fill="#fff"/></g>${cheeks(130)}`;
  } else if (m.id === 'pikjuk') {
    body = `<ellipse cx="76" cy="182" rx="18" ry="8" fill="${D}"/><ellipse cx="124" cy="182" rx="18" ry="8" fill="${D}"/>
      <rect x="46" y="44" width="108" height="136" rx="54" fill="${C}"/>
      <path d="M60 58 L70 22 L90 52Z" fill="${D}"/><path d="M90 50 L100 12 L110 50Z" fill="${D}"/><path d="M110 52 L130 22 L140 58Z" fill="${D}"/>
      ${eye(80,98,17)}${eye(120,98,17)}
      <g class="mouth"><path d="M68 132 Q100 166 132 132Z" fill="#3b1530"/><rect x="80" y="132" width="8" height="10" rx="2" fill="#fff"/><rect x="112" y="132" width="8" height="10" rx="2" fill="#fff"/></g>${cheeks(126)}`;
  } else {
    body = `<circle cx="46" cy="70" r="17" fill="${D}"/><circle cx="154" cy="70" r="17" fill="${D}"/>
      <path d="M28 150 Q18 80 70 56 Q100 44 130 56 Q182 80 172 150 Q170 182 100 182 Q30 182 28 150Z" fill="${C}"/>
      ${eye(64,98,14)}${eye(100,84,14)}${eye(136,98,14)}
      <g class="mouth"><path d="M68 132 Q100 164 132 132Z" fill="#4a1a2e"/><ellipse cx="100" cy="148" rx="13" ry="7" fill="#ff6b8a"/></g>${cheeks(128)}`;
  }
  return `<svg viewBox="0 0 200 200" aria-hidden="true">${body}</svg>`;
}

/* ===== 기본 도구 ===== */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); }

let sel = MONSTERS[0], delay = 0, kidName = '친구';
let ctx = null, wakeLock = null;
let ringTimer = null, declineTimer = null, waitTimer = null, callTimer = null;
let callId = 0;

try { const n = localStorage.getItem('monsterKid'); if (n) $('#name').value = n; } catch (e) {}

/* ===== 설정 화면 ===== */
const picker = $('#picker');
MONSTERS.forEach((m, i) => {
  const b = document.createElement('button');
  b.className = 'pick'; b.setAttribute('aria-pressed', i === 0);
  b.innerHTML = monsterSVG(m) + '<span>' + m.name + '</span>';
  b.addEventListener('click', () => {
    sel = m;
    picker.querySelectorAll('.pick').forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  picker.appendChild(b);
});
const sitsEl = $('#sits');
SITS.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = s.label; b.setAttribute('aria-pressed', i === 0);
  b.addEventListener('click', () => {
    sit = s;
    sitsEl.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  sitsEl.appendChild(b);
});
$('#chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  delay = Number(c.dataset.s);
  $('#chips').querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c));
});

/* ===== 소리 ===== */
function unlockAudio(){
  try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (e) {}
  try { if ('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
}
function beep(){
  if (!ctx) return;
  const t0 = ctx.currentTime;
  [660, 880, 660, 880].forEach((f, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain(), t = t0 + i * .18;
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.2, t + .02); g.gain.linearRampToValueAtTime(0, t + .16);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + .18);
  });
}
function vib(p){ try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function babble(text){
  return new Promise(res => {
    if (!ctx) { setTimeout(res, Math.max(2200, text.length * 230)); return; }
    let t = ctx.currentTime + .05; const base = 300 * sel.pitch;
    [...text].filter(c => c.trim()).forEach(c => {
      const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      const k = c.charCodeAt(0) % 7;
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(base * (.8 + k * .09), t);
      o.frequency.linearRampToValueAtTime(base * (.9 + ((k * 3) % 5) * .08), t + .1);
      f.type = 'lowpass'; f.frequency.value = 1400;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16, t + .015); g.gain.linearRampToValueAtTime(0, t + .1);
      o.connect(f); f.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + .11);
      t += .12; if ('.,!?'.indexOf(c) >= 0) t += .18;
    });
    setTimeout(res, (t - ctx.currentTime) * 1000 + 200);
  });
}
function speak(text){
  const myId = callId;
  return new Promise(res => {
    let done = false, fb = false, started = false, to, st;
    const fin = () => { if (!done) { done = true; clearTimeout(to); clearTimeout(st); res(); } };
    const fallback = () => {
      if (done || fb) return;
      if (myId !== callId) { fin(); return; }
      fb = true; try { speechSynthesis.cancel(); } catch (e) {}
      babble(text).then(fin);
    };
    if (!('speechSynthesis' in window)) { fallback(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.pitch = sel.pitch; u.rate = .95; u.volume = 1;
      const v = speechSynthesis.getVoices().find(x => x.lang && x.lang.replace('_','-').startsWith('ko'));
      if (v) u.voice = v;
      u.onstart = () => { started = true; clearTimeout(st); };
      u.onend = fin;
      u.onerror = () => { if (started) fin(); else fallback(); };
      speechSynthesis.speak(u);
      st = setTimeout(() => { if (!started) fallback(); }, 1800);
    } catch (e) { fallback(); return; }
    to = setTimeout(fin, Math.max(3000, text.length * 260) + 8000);
  });
}
async function lockScreen(){ try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
function unlockScreen(){ try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

$('#test').addEventListener('click', () => {
  unlockAudio(); beep();
  setTimeout(() => speak('안녕, 나는 ' + sel.name + ' 괴물이야!'), 900);
});

/* ===== 전화 시작 / 벨 ===== */
$('#start').addEventListener('click', () => {
  kidName = $('#name').value.trim() || '친구';
  try { localStorage.setItem('monsterKid', $('#name').value.trim()); } catch (e) {}
  unlockAudio(); lockScreen();
  if (delay === 0) return ring();
  let left = delay;
  const tick = () => { $('#waitText').textContent = '곧 전화가 와요 (' + left + ')'; };
  tick(); show('waiting');
  clearInterval(waitTimer);
  waitTimer = setInterval(() => { left--; if (left <= 0) { clearInterval(waitTimer); ring(); } else tick(); }, 1000);
});
$('#cancel').addEventListener('click', () => { clearInterval(waitTimer); unlockScreen(); show('setup'); });

function setTheme(){ document.documentElement.style.setProperty('--mc', sel.color); }

function ring(){
  setTheme();
  $('#ringName').textContent = sel.name + ' 괴물';
  $('#ringState').textContent = '전화가 왔어요!';
  const av = $('#ringAvatar'); av.innerHTML = monsterSVG(sel); av.classList.remove('sad'); av.classList.add('ringing');
  show('ring'); startRing();
}
function startRing(){
  stopRing(); beep(); vib([400, 200, 400]);
  ringTimer = setInterval(() => { beep(); vib([400, 200, 400]); }, 1800);
}
function stopRing(){ clearInterval(ringTimer); vib(0); }

$('#decline').addEventListener('click', () => {
  stopRing(); clearTimeout(declineTimer);
  const av = $('#ringAvatar'); av.classList.remove('ringing'); av.classList.add('sad');
  $('#ringState').textContent = '괴물이 다시 걸어요!';
  speak('이놈, 왜 전화를 안 받느냐! 다시 건다!');
  declineTimer = setTimeout(() => {
    av.classList.remove('sad'); av.classList.add('ringing');
    $('#ringState').textContent = '전화가 왔어요!'; startRing();
  }, 3800);
});

/* ===== 통화 ===== */
$('#answer').addEventListener('click', () => {
  stopRing(); clearTimeout(declineTimer);
  try { speechSynthesis.cancel(); } catch (e) {}
  const id = ++callId;
  $('#callName').textContent = sel.name + ' 괴물';
  $('#callAvatar').innerHTML = monsterSVG(sel);
  $('#subtitle').textContent = ''; $('#choices').innerHTML = '';
  show('call');
  const t0 = Date.now(); clearInterval(callTimer);
  const upd = () => { const s = Math.floor((Date.now() - t0) / 1000);
    $('#time').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  upd(); callTimer = setInterval(upd, 1000);
  runScript(id);
});

const fmt = t => t.split('{name}').join(kidName).split('{m}').join(sel.name);

async function say(text){
  const av = $('#callAvatar');
  $('#subtitle').textContent = text; av.classList.add('talking');
  await speak(text);
  av.classList.remove('talking');
  await sleep(350);
}
function askChoices(opts){
  return new Promise(res => {
    const box = $('#choices'); box.innerHTML = '';
    opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'choice'; b.textContent = o;
      b.addEventListener('click', () => { box.innerHTML = ''; res(i); });
      box.appendChild(b);
    });
  });
}
async function runScript(id){
  for (const step of buildLines()) {
    if (id !== callId) return;
    await say(fmt(step.say));
    if (step.ask) {
      const i = await askChoices(step.ask.map(a => a[0]));
      if (id !== callId) return;
      await say(fmt(step.ask[i][1]));
    }
  }
  await sleep(700);
  if (id === callId) hangup();
}

$('#hangup').addEventListener('click', hangup);
function hangup(){
  callId++;
  try { speechSynthesis.cancel(); } catch (e) {}
  clearInterval(callTimer); unlockScreen();
  $('#choices').innerHTML = '';
  $('#endAvatar').innerHTML = monsterSVG(sel);
  $('#endMsg').textContent = sel.name + ' 괴물과의 통화가 끝났어요!';
  $('#endTime').textContent = '통화 시간 ' + $('#time').textContent;
  show('end');
}
$('#again').addEventListener('click', () => show('setup'));
</script>
</body>
